services:
  aims-web:
    build: .
    container_name: aims-web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      # Set to e.g. "/showcal" if this is reachable at a sub-path of your
      # domain rather than at its root (see README.md). Leave blank/unset
      # for a dedicated subdomain instead.
      URL_PREFIX: ${URL_PREFIX:-}
      # Email notifications for new show submissions/feature suggestions
      # (see docs/deployment.md) - leaving SMTP_USER/SMTP_PASSWORD unset
      # just silently disables them rather than erroring.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-info@darraghc.ie}
      SITE_URL: ${SITE_URL:-https://darraghc.ie}
    volumes:
      # Absolute host path, not a relative "./data" - Portainer resolves
      # relative stack volume paths against its OWN internal view of the
      # filesystem, then hands that literal path string to the Docker
      # daemon (which runs directly on the NAS host, outside any
      # container). The daemon has no idea that path was "supposed to"
      # mean Portainer's own data folder, so it silently created and used
      # an unrelated, empty directory of the same name on the NAS's small
      # system partition instead - which doesn't survive a reboot the way
      # a real storage-pool path does. Match the other containers on this
      # NAS: mount a real, absolute path on the storage pool directly.
      - /share/CACHEDEV2_DATA/Data/config/aims-web:/data
    ports:
      # Kept published on the NAS's LAN interface for convenience/direct
      # debugging - there's no router port-forward, so this is LAN-reachable
      # only, never exposed to the internet directly. Not what the tunnel
      # actually uses any more, see "networks:" below.
      - "8000:8000"
    # Only on the shared network (not also on a separate "default" network
    # Compose would otherwise create for this stack) - aims-web joins the
    # same Docker network an existing cloudflared container (running in a
    # different stack, e.g. media-stack3) is already on, so it's reachable
    # as "aims-web:8000" by container name. Avoids relying on the host's LAN
    # IP, which containers on a *different* bridge network often can't loop
    # back through (hairpin NAT).
    networks:
      - media-net
    # A wedged waitress process (hung, deadlocked) would otherwise stay
    # "Up" forever with nothing to notice - python's own urllib rather than
    # curl/wget, since the python:3.12-slim base image has neither installed.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/robots.txt', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Runs the nightly backup itself, entirely inside Docker - not via QNAP's
  # own Task Scheduler (not present in Control Panel or App Center on this
  # NAS/firmware), not via HBS3 (its backup jobs have no pre/post-script
  # hook on this version), and not via a host crontab (needs real root -
  # the built-in "admin" superuser is disabled here, and the SSH account in
  # use isn't in the administrators group, so /etc/config/crontab and
  # crond itself aren't writable/restartable from it). A loop inside a
  # container sidesteps all of that: it's the same image, no new
  # dependencies, and nothing here depends on NAS-level permissions at all.
  # Timing drifts to "roughly every 24h from whenever this container last
  # started" rather than a fixed clock time, which is fine for a backup.
  aims-backup:
    build: .
    container_name: aims-backup
    restart: unless-stopped
    # command is a one-item list (not a bare multi-word string) so Compose
    # passes the whole script to "-c" as a single argument - a plain string
    # here gets word-split by Compose itself before it ever reaches the
    # shell, so only "while" ends up as the actual -c script and everything
    # after it becomes stray positional args instead of part of the loop.
    entrypoint: ["/bin/sh", "-c"]
    # Every backup is verified straight after it's taken - restored to a scratch
    # copy, integrity-checked, and the app's own derived tables rebuilt from it.
    # A backup nobody has restored is a hope rather than a backup, and the point
    # of failure you don't want to discover is the one where you need it. The
    # result lands in `docker logs aims-backup` either way.
    command:
      - |
        while true; do
          python backup_db.py --db /data/aims.db --backup-dir /data/backups
          python verify_backup.py --backup-dir /data/backups --db /data/aims.db \
            || echo "BACKUP VERIFICATION FAILED - see above"
          sleep 86400
        done
    volumes:
      - /share/CACHEDEV2_DATA/Data/config/aims-web:/data
    # Prints verification output every ~24h forever with no rotation
    # otherwise - bounded so the log can't grow unbounded on an
    # unattended NAS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Uncomment if you don't already have a cloudflared tunnel running
  # elsewhere on the NAS. Being in this same stack puts it on the same
  # Docker network as aims-web automatically - no host port needed at all,
  # you could then remove the "ports:" block above.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: aims-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - aims-web

networks:
  media-net:
    external: true
    name: media-stack3_media-net
