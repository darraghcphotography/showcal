services:
  aims-web:
    build: .
    container_name: aims-web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      # Set to e.g. "/showcal" if this is reachable at a sub-path of your
      # domain rather than at its root (see README.md). Leave blank/unset
      # for a dedicated subdomain instead.
      URL_PREFIX: ${URL_PREFIX:-}
    volumes:
      - ./data:/data
    ports:
      # Published on the NAS's LAN interface (not just loopback) so an
      # existing cloudflared container running in a *different* Docker
      # network/stack can still reach it via the NAS's own IP - there's no
      # router port-forward, so this is LAN-reachable only, never exposed to
      # the internet directly. If cloudflared instead lives in this same
      # stack (see below), you can drop back to "127.0.0.1:8000:8000" or
      # remove this entirely and reach it via "aims-web:8000" internally.
      - "8000:8000"

  # Uncomment if you don't already have a cloudflared tunnel running
  # elsewhere on the NAS. Being in this same stack puts it on the same
  # Docker network as aims-web automatically - no host port needed at all,
  # you could then remove the "ports:" block above.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: aims-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - aims-web
