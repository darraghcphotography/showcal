services:
  aims-web:
    build: .
    container_name: aims-web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      # Set to e.g. "/showcal" if this is reachable at a sub-path of your
      # domain rather than at its root (see README.md). Leave blank/unset
      # for a dedicated subdomain instead.
      URL_PREFIX: ${URL_PREFIX:-}
    volumes:
      # Absolute host path, not a relative "./data" - Portainer resolves
      # relative stack volume paths against its OWN internal view of the
      # filesystem, then hands that literal path string to the Docker
      # daemon (which runs directly on the NAS host, outside any
      # container). The daemon has no idea that path was "supposed to"
      # mean Portainer's own data folder, so it silently created and used
      # an unrelated, empty directory of the same name on the NAS's small
      # system partition instead - which doesn't survive a reboot the way
      # a real storage-pool path does. Match the other containers on this
      # NAS: mount a real, absolute path on the storage pool directly.
      - /share/CACHEDEV1_DATA/Data/config/aims-web:/data
    ports:
      # Kept published on the NAS's LAN interface for convenience/direct
      # debugging - there's no router port-forward, so this is LAN-reachable
      # only, never exposed to the internet directly. Not what the tunnel
      # actually uses any more, see "networks:" below.
      - "8000:8000"
    # Only on the shared network (not also on a separate "default" network
    # Compose would otherwise create for this stack) - aims-web joins the
    # same Docker network an existing cloudflared container (running in a
    # different stack, e.g. media-stack3) is already on, so it's reachable
    # as "aims-web:8000" by container name. Avoids relying on the host's LAN
    # IP, which containers on a *different* bridge network often can't loop
    # back through (hairpin NAT).
    networks:
      - media-net

  # Uncomment if you don't already have a cloudflared tunnel running
  # elsewhere on the NAS. Being in this same stack puts it on the same
  # Docker network as aims-web automatically - no host port needed at all,
  # you could then remove the "ports:" block above.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: aims-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - aims-web

networks:
  media-net:
    external: true
    name: media-stack3_media-net
