{% extends "base.html" %}
{% block title %}Set a new password - DC Show Tracker{% endblock %}
{% block content %}
  <h1>Set a new password</h1>
  <p>For the moderator login <strong>{{ username }}</strong>. This link works once.</p>
  <form method="post" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      New password <span class="hint">(at least {{ min_length }} characters)</span>
      <input type="password" name="password" minlength="{{ min_length }}" autocomplete="new-password" required autofocus>
    </label>
    <label>
      Type it again
      <input type="password" name="confirm" minlength="{{ min_length }}" autocomplete="new-password" required>
    </label>
    <button type="submit">Save new password</button>
  </form>
{% endblock %}
