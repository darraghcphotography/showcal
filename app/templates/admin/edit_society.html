{% extends "base.html" %}
{% block title %}Edit {{ society['name'] }} - Unofficial AIMS Show Tracker{% endblock %}
{% block content %}
  <p><a href="{{ url_for('admin.societies_list') }}">&larr; Back to societies</a></p>
  <h1>Edit society</h1>

  <form method="post" class="stacked-form" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>
      Name
      <input type="text" name="name" value="{{ society['name'] }}" required>
    </label>

    <label>
      Region
      <select name="region" required>
        {% for r in regions %}
          <option value="{{ r }}" {% if r == society['region'] %}selected{% endif %}>{{ r }}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      Tier
      <select name="section" required>
        {% for s in sections %}
          <option value="{{ s }}" {% if s == society['section'] %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      Section as of (season, e.g. 26/27)
      <input type="text" name="section_as_of" value="{{ society['section_as_of'] or '' }}">
    </label>

    <label>
      Section history
      <input type="text" name="section_history" value="{{ society['section_history'] or '' }}">
    </label>

    <label>
      Notes
      <input type="text" name="notes" value="{{ society['notes'] or '' }}">
    </label>

    <label>
      Default venue <span class="hint">(prefilled on a new show whenever venue is left blank)</span>
      <input type="text" name="default_venue" value="{{ society['default_venue'] or '' }}">
    </label>

    <fieldset>
      <legend>Logo</legend>
      {% if society['logo_filename'] %}
        <img class="poster-thumb" src="{{ url_for('public.uploaded_file', filename=society['logo_filename']) }}" alt="Current logo">
        <label class="checkbox-label">
          <input type="checkbox" name="remove_logo" value="1">
          Remove current logo
        </label>
      {% endif %}
      <label>
        {{ 'Replace logo' if society['logo_filename'] else 'Upload logo' }}
        <input type="file" name="logo" accept="image/png,image/jpeg,image/webp,image/gif">
      </label>
    </fieldset>

    <button type="submit">Save</button>
  </form>
{% endblock %}
