{% extends "base.html" %}
{% block title %}{{ 'Edit' if entry else 'Add' }} FAQ entry - DC Show Tracker{% endblock %}
{% block content %}
  <h1>{{ 'Edit' if entry else 'Add' }} FAQ entry</h1>

  <form method="post" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>
      Question
      <input type="text" name="question" value="{{ form.get('question', '') }}" required>
    </label>

    <label>
      Answer
      <textarea name="answer" rows="5" required>{{ form.get('answer', '') }}</textarea>
    </label>

    <button type="submit">{{ 'Save' if entry else 'Add as draft' }}</button>
  </form>

  <p><a href="{{ url_for('admin.faq_list') }}">&larr; Back to FAQ list</a></p>
{% endblock %}
